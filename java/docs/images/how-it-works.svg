<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How Movie Match ranks movies</title><desc id="desc">Genre similarity contributes 85 percent and the movie rating contributes 15 percent to the match score.</desc>
  <rect width="1200" height="300" rx="20" fill="#151618"/><text x="58" y="55" fill="#d9af76" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">A SIMPLE, TRANSPARENT MATCH SCORE</text>
  <g font-family="Arial,sans-serif"><text x="60" y="115" fill="#f4f1eb" font-size="20" font-weight="700">Genre similarity</text><text x="60" y="145" fill="#aaa7a0" font-size="13">Shared genres ÷ distinct genres across both films</text><rect x="60" y="172" width="720" height="28" rx="14" fill="#27282a"/><rect x="60" y="172" width="612" height="28" rx="14" fill="#d9af76"/><text x="800" y="194" fill="#e7c99f" font-size="21" font-weight="700">85%</text>
  <text x="60" y="251" fill="#f4f1eb" font-size="16">Genre similarity × 0.85</text><text x="310" y="251" fill="#85817b" font-size="18">+</text><text x="350" y="251" fill="#f4f1eb" font-size="16">Candidate rating ÷ 10 × 0.15</text>
  <text x="890" y="115" fill="#f4f1eb" font-size="20" font-weight="700">Film rating</text><text x="890" y="145" fill="#aaa7a0" font-size="13">A small boost for audience favorites</text><rect x="890" y="172" width="230" height="28" rx="14" fill="#27282a"/><rect x="890" y="172" width="80" height="28" rx="14" fill="#a9794b"/><text x="1133" y="194" fill="#e7c99f" font-size="21" font-weight="700">15%</text>
  <text x="890" y="251" fill="#aaa7a0" font-size="13">Highest total score ranks first.</text></g>
</svg>
