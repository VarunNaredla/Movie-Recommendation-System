<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Movie Match recommendation flow</title><desc id="desc">Choose a movie, compare its genres and rating, then receive a ranked shortlist.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#d9af76"/><stop offset="1" stop-color="#f0d2a3"/></linearGradient></defs>
  <rect width="1200" height="270" rx="20" fill="#151618"/><text x="58" y="53" fill="#d9af76" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">FROM FAVORITE TO NEXT FAVORITE</text>
  <g font-family="Arial,sans-serif"><g transform="translate(58 91)"><rect width="305" height="126" rx="12" fill="#202123" stroke="#ffffff" stroke-opacity=".12"/><circle cx="43" cy="42" r="19" fill="#d9af76"/><text x="43" y="48" text-anchor="middle" fill="#17130e" font-size="17" font-weight="700">1</text><text x="78" y="43" fill="#f4f1eb" font-size="18" font-weight="700">Choose a movie</text><text x="25" y="84" fill="#aaa7a0" font-size="13">Pick a title from the curated catalog.</text></g>
  <path d="M381 154h58m-10-10 10 10-10 10" fill="none" stroke="url(#g)" stroke-width="2"/>
  <g transform="translate(447 91)"><rect width="305" height="126" rx="12" fill="#202123" stroke="#ffffff" stroke-opacity=".12"/><circle cx="43" cy="42" r="19" fill="#d9af76"/><text x="43" y="48" text-anchor="middle" fill="#17130e" font-size="17" font-weight="700">2</text><text x="78" y="43" fill="#f4f1eb" font-size="18" font-weight="700">Compare the story</text><text x="25" y="84" fill="#aaa7a0" font-size="13">Score genre overlap and film ratings.</text></g>
  <path d="M770 154h58m-10-10 10 10-10 10" fill="none" stroke="url(#g)" stroke-width="2"/>
  <g transform="translate(836 91)"><rect width="305" height="126" rx="12" fill="#202123" stroke="#ffffff" stroke-opacity=".12"/><circle cx="43" cy="42" r="19" fill="#d9af76"/><text x="43" y="48" text-anchor="middle" fill="#17130e" font-size="17" font-weight="700">3</text><text x="78" y="43" fill="#f4f1eb" font-size="18" font-weight="700">Get your shortlist</text><text x="25" y="84" fill="#aaa7a0" font-size="13">See the closest matches, ranked for you.</text></g></g>
